name: Review audio catalogue references
on:
  pull_request:
    paths:
      - "scripts/audio-qa-reference-usage.py"
      - ".github/workflows/audio-reference-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect references to all 379 MP3 and broken catalogue links
        run: python scripts/audio-qa-reference-usage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-reference-integrity-379
          path: audio-reference-review/
          retention-days: 90
