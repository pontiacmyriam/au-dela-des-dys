name: Launch quality
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run qa:launch
      - run: CI=true npm test -- --watchAll=false
      - run: npm run build
